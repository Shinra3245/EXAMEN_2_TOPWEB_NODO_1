openapi: 3.0.0
info:
  title: API Banco Central - Sistema Bancario Distribuido
  description: Endpoints del núcleo del Banco Central para la comunicación con Sucursales
    y Cajeros (ATMs).
  version: 1.0.2
servers:
- url: https://banco-central-nodo1.onrender.com/api
  description: Nodo 1 desplegado y validado en Render
- url: http://localhost:8000/api
  description: Servidor de desarrollo local
paths:
  /accounts:
    post:
      summary: Crear nueva cuenta de usuario
      description: Solo una sucursal registra cuentas. Un saldo inicial positivo se
        registra como deposito con nodo_id y sucursal_id; los importes admiten hasta
        dos decimales.
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - numero_cuenta
              - nombre_titular
              - saldo_inicial
              - idempotency_key
              properties:
                numero_cuenta:
                  type: string
                nombre_titular:
                  type: string
                saldo_inicial:
                  type: number
                  minimum: 0
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Cuenta creada exitosamente.
        '422':
          description: Errores de validación (e.g. número de cuenta duplicado).
        '500':
          description: Error al crear la cuenta.
        '403':
          description: El nodo autenticado no es una sucursal.
        '401':
          description: API Key ausente, inválida o de nodo inactivo.
  /accounts/{numero_cuenta}:
    get:
      summary: Consultar saldo y detalles de la cuenta
      security:
      - ApiKeyAuth: []
      parameters:
      - name: numero_cuenta
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detalles de la cuenta.
        '404':
          description: Cuenta no encontrada.
        '401':
          description: API Key ausente, inválida o de nodo inactivo.
  /transactions:
    post:
      summary: Registrar transacción (Retiro/Depósito/Transferencia)
      description: Operaciones atómicas con bloqueo de cuentas y serialización por
        idempotency_key. Un reintento conserva nodo, tipo, cuentas y monto; la misma
        operación retorna la transacción existente sin repetir cambios.
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tipo
              - monto
              - idempotency_key
              properties:
                tipo:
                  type: string
                  enum:
                  - retiro
                  - deposito
                  - transferencia
                monto:
                  type: number
                  minimum: 0.01
                cuenta_origen:
                  type: string
                cuenta_destino:
                  type: string
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Transacción aprobada y saldo actualizado.
        '200':
          description: Transacción procesada previamente (Idempotencia).
        '400':
          description: Fondos insuficientes o cuenta no encontrada/inactiva.
        '422':
          description: Errores de validación.
        '409':
          description: La clave de idempotencia ya pertenece a una operación con otros
            datos o a otro nodo.
        '401':
          description: API Key ausente, inválida o de nodo inactivo.
    get:
      summary: Consultar historial de transacciones
      description: Devuelve exclusivamente las operaciones procesadas por el nodo
        autenticado (nodo_id), filtrables por cuenta. La sucursal no ve retiros
        procesados por un cajero; el saldo global se consulta en /accounts/{numero_cuenta}.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: cuenta
        in: query
        required: false
        schema:
          type: string
        description: Filtrar transacciones por número de cuenta (origen o destino).
      responses:
        '200':
          description: Lista paginada de transacciones.
        '401':
          description: API Key ausente, inválida o de nodo inactivo.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
